plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nucleus.reactorfocus'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nucleus.reactorfocus'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('assembleWebIndex') {
    doLast {
        def dir = file('src/main/assets/www')
        def out = new File(dir, 'index.html')
        out.text = ''
        ['index.part01.txt','index.part02.txt','index.part03.txt','index.part04.txt'].each { name ->
            out << new File(dir, name).getText('UTF-8')
        }
    }
}

preBuild.dependsOn assembleWebIndex
