name: Build Reactor Focus Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release Android App Bundle
        run: gradle :app:bundleRelease --stacktrace

      - name: Prepare artifacts
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ReactorFocus.apk
          cp app/build/outputs/bundle/release/app-release.aab ReactorFocus-unsigned.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReactorFocus-APK
          path: ReactorFocus.apk
          if-no-files-found: error

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: ReactorFocus-AAB-Unsigned
          path: ReactorFocus-unsigned.aab
          if-no-files-found: error
